[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula.fabric"
version = "3.10.0"
description = "Base framework for Nebula Rivulet - provides core services, messaging, and algorithms"
authors = [{ name = "Administrator", email = "administrator@xecutables.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xgboost",
    "ollama",
    "pyodbc",
    "sqlalchemy",
    "kafka-python",
    "paho-mqtt",
    "pika",
    "redis",
]

[project.urls]
Homepage = "https://github.com/yourusername/nebula.rivulet"
