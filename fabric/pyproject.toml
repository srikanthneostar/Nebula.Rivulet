[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula.rivulet.fabric"
version = "3.10.0"
description = "A powerful framework for running AI pipelines with Elasticsearch data"
authors = [
    {name = "Administrator", email = "administrator@xecutables.com"},
]
dependencies = [
        "elasticsearch>=7.0.0,<8.0.0",
        "pandas>=1.0.0",
        "sentence-transformers",
        "chromadb",
        "chroma",
        "jq",
        "langchain",
        "langchain-community",
        "langchain-openai",
        "python-dotenv",
        "scikit-learn>=0.24.0",
]
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/yourusername/nebula.rivulet"
