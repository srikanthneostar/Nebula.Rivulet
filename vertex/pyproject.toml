[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula.vertex"
version = "3.10.0"
description = "REST API layer for Nebula Rivulet - provides FastAPI endpoints for search and ML operations"
authors = [
    {name = "Administrator", email = "administrator@xecutables.com"},
]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-jose[cryptography]",
    "python-multipart",
    "celery",
    "pydantic",
    "pycryptodome"
]
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/yourusername/nebula.rivulet"
