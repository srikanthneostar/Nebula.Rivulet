---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-rivulet
  namespace: core-insights-nebula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-rivulet
  template:
    metadata:
      labels:
        app: nebula-rivulet
    spec:
      containers:
        - name: nebula-rivulet
          image: placeholder/nebula-rivulet:latest
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          terminationMessagePath: /dev/termination-rivulet.log
          terminationMessagePolicy: File
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: NEBULA_RIVULET_HOME
              value: /usr/Nebula.Rivulet/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: regcred
