---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-rivulet
  namespace: core-insights-nebula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-rivulet
  template:
    metadata:
      labels:
        app: nebula-rivulet
    spec:
      progressDeadlineSeconds: 900
      containers:
        - name: nebula-rivulet
          image: srikanthneostar/nebula-rivulet:latest
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: NEBULA_RIVULET_HOME
              value: /usr/Nebula.Rivulet/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
      imagePullSecrets:
        - name: regcred
